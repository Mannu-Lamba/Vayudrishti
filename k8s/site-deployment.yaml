# The website, the model test bench and the metrics dashboard, on one port. This pod serves files and
# forwards /api to the backend; no model runs here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: site
  namespace: vayudrishti
  labels:
    app.kubernetes.io/name: site
    app.kubernetes.io/part-of: vayudrishti
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: site
  template:
    metadata:
      labels:
        app.kubernetes.io/name: site
        app.kubernetes.io/part-of: vayudrishti
    spec:
      containers:
        - name: site
          image: vayudrishti-site:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            # The backend Service inside the cluster.
            - name: BACKEND_URL
              value: http://backend:8001
          volumeMounts:
            # The held-out crops the bench shows at /img/ are 379 MB, so they stay out of the image.
            - name: bench-images
              mountPath: /app/identification_model/data/processed
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000 # the node account in the official Node image
            allowPrivilegeEscalation: false
            # The server only reads files and forwards requests, so it needs no writable filesystem.
            # If a future change makes it write anything, set this to false or mount an emptyDir.
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        # kind/cluster.yaml mounts the crops from this machine into the node at this path. Without that
        # mount the directory is empty: every page still works, but the bench shows no sample images.
        - name: bench-images
          hostPath:
            path: /mnt/vayudrishti/img
            type: DirectoryOrCreate
