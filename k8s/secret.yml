# Every secret the cluster needs. The values below are placeholders for a local kind cluster: change them
# before using this anywhere else, and keep the real file out of version control.
#
# stringData takes plain text, and Kubernetes stores it base64-encoded. That encoding is not encryption:
# anyone who can read Secrets in this namespace can read these values.
apiVersion: v1
kind: Secret
metadata:
  name: vayudrishti-secrets
  namespace: vayudrishti
  labels:
    app.kubernetes.io/part-of: vayudrishti
type: Opaque
stringData:
  # The mongo container creates this administrator account on its first start, in an empty data volume.
  # Changing them later does not change the account; delete the PersistentVolumeClaim to start over.
  MONGO_ROOT_USERNAME: vayudrishti
  MONGO_ROOT_PASSWORD: change-me-before-using-this

  # How the backend connects. The user and password must match the two values above, and authSource=admin
  # is where the administrator account lives.
  MONGODB_URI: mongodb://vayudrishti:change-me-before-using-this@mongo:27017/?authSource=admin

  # Analyst chat. Leave empty to run without it; the rest of the application is unaffected.
  EMERGENT_LLM_KEY: ""
